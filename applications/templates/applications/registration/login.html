```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Job Application Tracker Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center">
        <div class="card shadow-sm border-0 p-4 w-100" style="max-width: 420px;">
            <div class="card-body">
                <h1 class="h3 text-center mb-2">Welcome Back</h1>
                <p class="text-muted text-center mb-4">
                    Login to Job Application Tracker Pro
                </p>

                {% if form.errors %}
                    <div class="alert alert-danger">
                        Incorrect username or password. Please try again.
                    </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input type="text" name="username" id="id_username"
                               class="form-control" autocomplete="username"
                               required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label">Password</label>
                        <input type="password" name="password" id="id_password"
                               class="form-control" autocomplete="current-password"
                               required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Login
                    </button>
                </form>

                




<p class="text-center mt-3 mb-0">
    <span class="text-muted">Don't have an account?</span>
    <a href="{% url 'register' %}" class="text-decoration-none fw-semibold">
        Create account
    </a>
</p>



            </div>
        </div>
    </div>
</body>
</html>
