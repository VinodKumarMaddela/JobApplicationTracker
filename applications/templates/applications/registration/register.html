
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create Account | Job Application Tracker Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
        <div class="card shadow-sm border-0 p-4 w-100" style="max-width: 460px;">
            <div class="card-body">
                <h1 class="h3 text-center mb-2">Create Your Account</h1>
                <p class="text-muted text-center mb-4">
                    Join Job Application Tracker Pro
                </p>

                {% if form.errors %}
                <div class="alert alert-danger" role="alert">
                    <strong>Please correct the following:</strong>
                    {{ form.errors }}
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label">Username</label>
                        <input
                            type="text"
                            name="username"
                            id="id_username"
                            class="form-control"
                            value="{{ form.username.value|default_if_none:'' }}"
                            autocomplete="username"
                            required
                            autofocus
                        >
                        <div class="form-text">
                            Choose a unique username.
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="id_password1" class="form-label">Password</label>
                        <input
                            type="password"
                            name="password1"
                            id="id_password1"
                            class="form-control"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label for="id_password2" class="form-label">Confirm Password</label>
                        <input
                            type="password"
                            name="password2"
                            id="id_password2"
                            class="form-control"
                            autocomplete="new-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Create Account
                    </button>
                </form>

                <p class="text-center mt-4 mb-0">
                    <span class="text-muted">Already have an account?</span>
                    <a href="{% url 'login' %}" class="text-decoration-none">
                        Sign in
                    </a>
                </p>

                <p class="text-center text-muted small mt-3 mb-0">
                    Your job applications remain private to your account.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
